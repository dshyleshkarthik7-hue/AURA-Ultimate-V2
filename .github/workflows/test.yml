name: test
on: [push,pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test*.py' -v
      - run: python -m compileall -q aura app.py train.py evaluate.py auto_cycle.py scripts
      - run: python scripts/export_web_config.py
      - run: python scripts/export_web_model.py
      - run: python scripts/validate_web_contract.py
      - run: python scripts/validate_model_artifact.py
      - run: node --check web/app.js
      - run: node tests/web_smoke.js
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_integration.mjs
